<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Box of Letters ♡</title>
  <meta name="description" content="A little collection of letters, made just for you." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ambient ambient-1"></div>
  <div class="ambient ambient-2"></div>

  <main class="site-shell">
    <header class="hero">
      <div class="tiny-heart" aria-hidden="true">♡</div>
      <p class="eyebrow">A little box of letters</p>
      <h1>For whenever<br><em>you need me.</em></h1>
      <p class="intro">
        I can't always be right there beside you, so I made you a little
        place you can come back to whenever you need a piece of me.
      </p>
      <div class="scroll-hint">open one whenever you need it <span>↓</span></div>
    </header>

    <section class="letters-section" aria-label="Open when letters">
      <div class="section-heading">
        <span></span>
        <p>choose an envelope</p>
        <span></span>
      </div>

      <div id="envelopeGrid" class="envelope-grid"></div>
    </section>

    <footer>
      <p>Made with love, just for you.</p>
      <span>♡</span>
    </footer>
  </main>

  <!-- Letter modal -->
  <div id="letterModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>

    <article class="letter-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="close-button" type="button" aria-label="Close letter" data-close>×</button>

      <div class="modal-decoration">♡</div>
      <p id="modalEyebrow" class="modal-eyebrow"></p>
      <h2 id="modalTitle"></h2>
      <div id="modalMessage" class="modal-message"></div>

      <div class="letter-signoff">
        <span>always,</span>
        <strong>me ♡</strong>
      </div>

      <button class="next-button" id="nextButton" type="button">
        open another <span>→</span>
      </button>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
